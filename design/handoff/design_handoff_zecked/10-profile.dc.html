<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="zk-tokens.css"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Inter:wght@400;500;600;700;800&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet"></helmet>
<section id="10-profile" data-screen-label="10 Profile" style="display:flex;flex-direction:column;gap:var(--zk-space-18);padding:var(--zk-space-14)">
<header style="display:flex;align-items:baseline;gap:var(--zk-space-10);font:var(--zk-type-body-strong);color:var(--zk-text-muted)"><span style="font:var(--zk-type-mono-sm);color:var(--zk-gold)">10</span>Profile</header>
<div style="width:var(--zk-phone-w);height:var(--zk-phone-h);border-radius:var(--zk-radius-phone);background:var(--zk-bg-hero-gold);box-shadow:var(--zk-shadow-phone);position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--zk-text);font-family:var(--zk-font-body);flex:none">
<dc-import name="ZK Device Chrome" style="position:absolute;inset:0;z-index:40;pointer-events:none" hint-size="390px,844px"></dc-import>
<div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--zk-space-14);padding:calc(var(--zk-statusbar-h) + var(--zk-space-8)) var(--zk-screen-pad) var(--zk-space-16);overflow:hidden">
<div style="display:flex;align-items:center;gap:var(--zk-space-12)">
<div style="width:52px;height:52px;border-radius:50%;background:var(--zk-grad-tile-purple);display:flex;align-items:center;justify-content:center;box-shadow:var(--zk-inset-gloss),0 3px 0 var(--zk-purple-shade);font:var(--zk-type-h3)">N</div>
<div style="flex:1"><div style="font:var(--zk-type-h3)">@nightowl</div><div style="display:flex;align-items:center;gap:var(--zk-space-4);font:var(--zk-type-caption);color:var(--zk-text-muted)">Zecking since Sep 2026 · <span style="display:inline-flex;align-items:center;gap:var(--zk-space-2);color:var(--zk-mint)">Shielded<dc-import name="ZK Icon" icon="check" size="{{ 12 }}" stroke="{{ 3 }}" hint-size="12px,12px"></dc-import></span></div></div>
<div role="button" aria-label="Settings" style="width:40px;height:40px;border-radius:var(--zk-radius-md);background:var(--zk-surface);display:flex;align-items:center;justify-content:center"><dc-import name="ZK Icon" icon="sliders" size="{{ 18 }}" hint-size="18px,18px"></dc-import></div>
</div>
<div style="background:linear-gradient(160deg,var(--zk-surface-purple),var(--zk-surface) 60%);border-radius:var(--zk-radius-3xl);padding:var(--zk-space-18);display:flex;flex-direction:column;align-items:center;border:1.5px solid rgb(var(--zk-gold-rgb) / .3);position:relative;overflow:hidden">
<div aria-hidden="true" style="position:absolute;left:50%;top:-80px;margin-left:-160px;width:320px;height:320px;border-radius:50%;background:var(--zk-sunburst-gold);will-change:transform;animation:zk-spin 40s linear infinite"></div>
<div style="position:relative"><dc-import name="ZK Emblem" tier="safecracker" size="{{ 100 }}" hint-size="100px,112px"></dc-import></div>
<div style="position:relative;font:var(--zk-type-label);letter-spacing:var(--zk-track-label);color:var(--zk-text-muted);margin-top:var(--zk-space-12)">CURRENT TIER</div>
<div style="position:relative;font:var(--zk-fw-black) var(--zk-fs-30)/1 var(--zk-font-display);color:var(--zk-gold);margin-top:var(--zk-space-4)">Safecracker</div>
<div style="position:relative;width:100%;margin-top:var(--zk-space-14)"><div role="progressbar" aria-valuenow="1240" aria-valuemax="1500" style="height:14px;border-radius:var(--zk-radius-pill);background:var(--zk-bg);overflow:hidden"><div style="height:100%;width:83%;border-radius:var(--zk-radius-pill);background:var(--zk-grad-xp);box-shadow:inset 0 -3px 0 rgb(var(--zk-black-rgb) / .18)"></div></div><div style="margin-top:var(--zk-space-6);display:flex;justify-content:space-between;font:var(--zk-fw-semibold) var(--zk-fs-11)/1 var(--zk-font-body);color:var(--zk-text-muted)"><span style="font-family:var(--zk-font-mono)">1,240 / 1,500 XP</span><span>260 XP to Vault Breaker</span></div></div>
</div>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:var(--zk-space-6)">
<sc-for list="{{ stats }}" as="s" hint-placeholder-count="5"><div style="background:var(--zk-surface);border-radius:var(--zk-radius-lg);padding:var(--zk-space-10) var(--zk-space-4);text-align:center"><div style="font:var(--zk-fw-black) var(--zk-fs-22)/1 var(--zk-font-display);color:{{ s.c }}">{{ s.v }}</div><div style="font:var(--zk-fw-bold) var(--zk-fs-10)/1 var(--zk-font-body);color:var(--zk-text-muted);margin-top:var(--zk-space-6)">{{ s.l }}</div></div></sc-for>
</div>
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font:var(--zk-type-h3)">Badges</span><span style="font:var(--zk-type-caption);color:var(--zk-text-muted)">4 / 7</span></div>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:var(--zk-space-10) var(--zk-space-6)">
<sc-for list="{{ badges }}" as="b" hint-placeholder-count="7"><div style="display:flex;flex-direction:column;align-items:center;gap:var(--zk-space-6)"><dc-import name="ZK Badge" badge="{{ b.id }}" locked="{{ b.locked }}" size="{{ 60 }}" hint-size="60px,60px"></dc-import><span style="font:var(--zk-fw-bold) var(--zk-fs-11)/1.2 var(--zk-font-body);color:{{ b.c }};text-align:center">{{ b.name }}</span></div></sc-for>
</div>
</div>
<dc-import name="ZK Tab Bar" active="profile" hint-size="390px,90px"></dc-import>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      stats: [
        { v: '14', l: 'Cracked', c: 'var(--zk-gold)' }, { v: '6', l: 'Hidden', c: 'var(--zk-pink)' }, { v: '2', l: 'Uncrackable', c: 'var(--zk-purple-light)' },
        { v: '1', l: 'Oracle', c: 'var(--zk-sky)' }, { v: '5🔥', l: 'Streak', c: 'var(--zk-text)' }
      ],
      badges: [
        { id: 'first', name: 'First Crack' }, { id: 'uncrackable', name: 'Uncrackable' }, { id: 'speed', name: 'Speed Demon' }, { id: 'shielded', name: 'Shielded' },
        { id: 'oracle', name: 'Oracle 1/3', locked: true }, { id: 'whale', name: 'Whale Hider', locked: true }, { id: 'bday', name: 'Birthday OG', locked: true }
      ].map(b => ({ ...b, locked: !!b.locked, c: b.locked ? 'var(--zk-text-faint)' : 'var(--zk-text)' }))
    };
  }
}
</script>
</body>
</html>
