<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc><helmet><link rel="stylesheet" href="zk-tokens.css"></helmet>
<nav aria-label="Main" style="flex:none;height:var(--zk-tabbar-h);background:rgb(var(--zk-bg-rgb) / .97);border-top:1px solid var(--zk-border);display:grid;grid-template-columns:repeat(4,1fr);padding:var(--zk-space-10) var(--zk-space-8) 0;box-sizing:border-box;position:relative;z-index:11">
<sc-for list="{{ items }}" as="t" hint-placeholder-count="4"><div role="tab" aria-selected="{{ t.sel }}" onClick="{{ t.go }}" style="display:flex;flex-direction:column;align-items:center;gap:var(--zk-space-4);cursor:pointer">
<div style="width:52px;height:32px;border-radius:var(--zk-radius-lg);background:{{ t.bg }};color:{{ t.fg }};display:flex;align-items:center;justify-content:center"><dc-import name="ZK Icon" icon="{{ t.icon }}" size="{{ 22 }}" stroke="{{ t.sw }}" hint-size="22px,22px"></dc-import></div>
<span style="font:{{ t.font }};color:{{ t.fg }}">{{ t.label }}</span>
</div></sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:90},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;leaderboard&quot;,&quot;hide&quot;,&quot;profile&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;'home'|'leaderboard'|'hide'|'profile'&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id: string) =&gt; void&quot;}}">
const TABS = [['home', 'Home', 'home'], ['leaderboard', 'Leaderboard', 'trophy'], ['hide', 'Hide', 'vault'], ['profile', 'Profile', 'user']];
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    return {
      items: TABS.map(([id, label, icon]) => {
        const on = id === a;
        return { label, icon, sel: on ? 'true' : 'false', sw: on ? 2.4 : 2, go: () => this.props.onSelect && this.props.onSelect(id),
          bg: on ? 'var(--zk-gold-tint)' : 'transparent', fg: on ? 'var(--zk-gold)' : 'var(--zk-text-muted)',
          font: on ? 'var(--zk-fw-black) var(--zk-fs-11)/1 var(--zk-font-body)' : 'var(--zk-type-tab)' };
      })
    };
  }
}
</script>
</body>
</html>
