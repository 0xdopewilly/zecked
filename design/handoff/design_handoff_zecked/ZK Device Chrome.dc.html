<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc><helmet><link rel="stylesheet" href="zk-tokens.css"></helmet>
<div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;z-index:40">
<div style="height:var(--zk-statusbar-h);display:flex;align-items:center;justify-content:space-between;padding:0 var(--zk-space-28) 0 var(--zk-space-32);font:var(--zk-type-status);color:var(--zk-text)">
<span style="min-width:54px">{{ time }}</span>
<span style="display:flex;gap:var(--zk-space-6);align-items:center">
<svg viewBox="0 0 18 12" width="18" height="12"><path d="M1 11h2.5V8H1zM5.8 11h2.5V6H5.8zM10.6 11h2.5V3.5h-2.5zM15.4 11h2.5V1h-2.5z" style="fill:currentColor"></path></svg>
<span style="font:var(--zk-fw-bold) var(--zk-fs-12)/1 var(--zk-font-body)">5G</span>
<svg viewBox="0 0 27 13" width="27" height="13"><rect x="0.75" y="0.75" width="22.5" height="11.5" rx="3.5" style="fill:none;stroke:rgb(var(--zk-white-rgb) / .5);stroke-width:1.5"></rect><rect x="2.6" y="2.6" width="16" height="7.8" rx="2" style="fill:currentColor"></rect><path d="M24.8 4.6v3.8a1.9 1.9 0 0 0 0-3.8z" style="fill:rgb(var(--zk-white-rgb) / .5)"></path></svg>
</span>
</div>
<div style="position:absolute;top:11px;left:50%;margin-left:-60px;width:120px;height:34px;border-radius:var(--zk-radius-pill);background:var(--zk-black)"></div>
<div style="position:absolute;bottom:var(--zk-space-8);left:50%;margin-left:-67px;width:134px;height:5px;border-radius:var(--zk-radius-pill);background:rgb(var(--zk-white-rgb) / .4)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:120},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;9:41&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showTime&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() { return { time: this.props.showTime === false ? '' : this.props.time ?? '9:41' }; }
}
</script>
</body>
</html>
