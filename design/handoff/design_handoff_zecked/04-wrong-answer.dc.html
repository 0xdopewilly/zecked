<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="zk-tokens.css"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Inter:wght@400;500;600;700;800&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet"></helmet>
<section id="04-wrong-answer" data-screen-label="04 Wrong answer" style="display:flex;flex-direction:column;gap:var(--zk-space-18);padding:var(--zk-space-14)">
<header style="display:flex;align-items:baseline;gap:var(--zk-space-10);font:var(--zk-type-body-strong);color:var(--zk-text-muted)"><span style="font:var(--zk-type-mono-sm);color:var(--zk-gold)">04</span>Wrong answer</header>
<div style="width:var(--zk-phone-w);height:var(--zk-phone-h);border-radius:var(--zk-radius-phone);background:var(--zk-bg-hero-red);box-shadow:var(--zk-shadow-phone);position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--zk-text);font-family:var(--zk-font-body);flex:none">
<dc-import name="ZK Device Chrome" style="position:absolute;inset:0;z-index:40;pointer-events:none" hint-size="390px,844px"></dc-import>
<div style="flex:1;display:flex;flex-direction:column;gap:var(--zk-space-14);padding:calc(var(--zk-statusbar-h) + var(--zk-space-6)) var(--zk-screen-pad) var(--zk-space-40)">
<nav style="display:flex;align-items:center;justify-content:space-between">
<div role="button" aria-label="Back" style="width:var(--zk-tap-min);height:var(--zk-tap-min);border-radius:var(--zk-radius-lg);background:var(--zk-surface);display:flex;align-items:center;justify-content:center"><dc-import name="ZK Icon" icon="back" size="{{ 22 }}" stroke="{{ 2.4 }}" hint-size="22px,22px"></dc-import></div>
<span style="font:var(--zk-type-label);letter-spacing:var(--zk-track-label);color:var(--zk-pink)">RIDDLE STASH</span>
<div role="button" aria-label="Share" style="width:var(--zk-tap-min);height:var(--zk-tap-min);border-radius:var(--zk-radius-lg);background:var(--zk-surface);display:flex;align-items:center;justify-content:center"><dc-import name="ZK Icon" icon="share" size="{{ 20 }}" stroke="{{ 2.2 }}" hint-size="20px,20px"></dc-import></div>
</nav>
<div style="display:flex;align-items:center;gap:var(--zk-space-12)">
<dc-import name="ZK Emblem" tier="safecracker" size="{{ 42 }}" hint-size="42px,47px"></dc-import>
<div style="flex:1"><div style="font:var(--zk-type-body-strong);font-size:var(--zk-fs-15)">@satoshisghost</div><div style="font:var(--zk-type-caption);color:var(--zk-gold)">Safecracker · 6 stashes hidden</div></div>
<div style="text-align:right"><div style="font:var(--zk-type-mono-lg);color:var(--zk-gold)">0.02 ZEC</div><div style="font:var(--zk-type-caption);color:var(--zk-text-muted)">~$30</div></div>
</div>
<div style="background:var(--zk-surface);border-radius:var(--zk-radius-3xl);padding:var(--zk-space-20);opacity:.75"><h2 style="margin:0;font:var(--zk-type-riddle);letter-spacing:-.01em;text-wrap:pretty">I have cities, but no houses. Forests, but no trees. Water, but no fish. What am I?</h2></div>
<div role="alert" style="display:flex;flex-direction:column;align-items:center;gap:var(--zk-space-6);padding:var(--zk-space-10) 0 var(--zk-space-4);text-align:center">
<div style="font:var(--zk-fw-black) var(--zk-fs-40)/1 var(--zk-font-display);color:var(--zk-red);transform:rotate(-3deg);text-shadow:var(--zk-text-shadow-red)">Nope!</div>
<div style="font:var(--zk-type-btn-md)">2 tries left</div>
<div style="font:var(--zk-type-body);font-size:var(--zk-fs-15);color:var(--zk-text-muted)">Bold guess. Wrong, but bold 😏</div>
</div>
<dc-import name="ZK Input" value="a globe" state="error" strike="{{ true }}" shake-loop="{{ true }}" hint-size="100%,62px"></dc-import>
<dc-import name="ZK Button" label="TRY AGAIN" variant="primary" size="lg" hint-size="100%,62px"></dc-import>
<div style="display:flex;align-items:center;gap:var(--zk-space-6)"><span style="width:12px;height:12px;border-radius:50%;background:var(--zk-gold)"></span><span style="width:12px;height:12px;border-radius:50%;background:var(--zk-gold)"></span><span style="width:12px;height:12px;border-radius:50%;background:rgb(var(--zk-red-rgb) / .35)"></span><span style="font:var(--zk-type-small);color:var(--zk-text-muted);margin-left:var(--zk-space-4)">2 tries left (resets in 10 min)</span></div>
<div style="margin-top:auto"><dc-import name="ZK Toast" variant="default" icon="eyeOff" text="Wrong guesses are private. Only you know you said “globe”." hint-size="100%,60px"></dc-import></div>
</div>
</div>
</section>
</x-dc>
</body>
</html>
