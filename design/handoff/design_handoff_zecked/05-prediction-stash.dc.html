<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="zk-tokens.css"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Inter:wght@400;500;600;700;800&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet"></helmet>
<section id="05-prediction-stash" data-screen-label="05 Prediction stash" style="display:flex;flex-direction:column;gap:var(--zk-space-18);padding:var(--zk-space-14)">
<header style="display:flex;align-items:baseline;gap:var(--zk-space-10);font:var(--zk-type-body-strong);color:var(--zk-text-muted)"><span style="font:var(--zk-type-mono-sm);color:var(--zk-gold)">05</span>Prediction stash<span style="color:var(--zk-text-faint)">· use the steppers</span></header>
<div style="width:var(--zk-phone-w);height:var(--zk-phone-h);border-radius:var(--zk-radius-phone);background:var(--zk-bg-hero-sky);box-shadow:var(--zk-shadow-phone);position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--zk-text);font-family:var(--zk-font-body);flex:none">
<dc-import name="ZK Device Chrome" style="position:absolute;inset:0;z-index:40;pointer-events:none" hint-size="390px,844px"></dc-import>
<div style="flex:1;display:flex;flex-direction:column;gap:var(--zk-space-12);padding:calc(var(--zk-statusbar-h) + var(--zk-space-6)) var(--zk-space-16) var(--zk-space-40)">
<nav style="display:flex;align-items:center;justify-content:space-between">
<div role="button" aria-label="Back" style="width:var(--zk-tap-min);height:var(--zk-tap-min);border-radius:var(--zk-radius-lg);background:var(--zk-surface);display:flex;align-items:center;justify-content:center"><dc-import name="ZK Icon" icon="back" size="{{ 22 }}" stroke="{{ 2.4 }}" hint-size="22px,22px"></dc-import></div>
<span style="font:var(--zk-type-label);letter-spacing:var(--zk-track-label);color:var(--zk-sky)">PREDICTION STASH</span>
<div role="button" aria-label="Share" style="width:var(--zk-tap-min);height:var(--zk-tap-min);border-radius:var(--zk-radius-lg);background:var(--zk-surface);display:flex;align-items:center;justify-content:center"><dc-import name="ZK Icon" icon="share" size="{{ 20 }}" stroke="{{ 2.2 }}" hint-size="20px,20px"></dc-import></div>
</nav>
<div style="background:linear-gradient(160deg,var(--zk-surface-navy),var(--zk-surface) 60%);border-radius:var(--zk-radius-3xl);padding:var(--zk-space-16) var(--zk-space-18) var(--zk-space-18);border:1.5px solid rgb(var(--zk-sky-rgb) / .3);box-shadow:var(--zk-glow-sky)">
<div style="display:flex;justify-content:space-between;align-items:center"><span style="font:var(--zk-type-caption);font-weight:var(--zk-fw-bold);color:var(--zk-text-muted)">Champions League · Tue 30 Sep · 20:00</span><dc-import name="ZK Live Badge" label="Live" hint-size="60px,22px"></dc-import></div>
<div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin-top:var(--zk-space-14)">
<div style="display:flex;flex-direction:column;align-items:center;gap:var(--zk-space-6)"><dc-import name="ZK Team Badge" code="BAR" color="var(--zk-team-bar)" size="{{ 68 }}" hint-size="68px,68px"></dc-import><span style="font:var(--zk-type-body-strong)">Barcelona</span></div>
<div style="font:var(--zk-type-h3);color:var(--zk-text-muted)">VS</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:var(--zk-space-6)"><dc-import name="ZK Team Badge" code="CHE" color="var(--zk-team-che)" size="{{ 68 }}" hint-size="68px,68px"></dc-import><span style="font:var(--zk-type-body-strong)">Chelsea</span></div>
</div>
<div style="margin-top:var(--zk-space-14);display:flex;align-items:center;justify-content:center;gap:var(--zk-space-8)"><span style="font:var(--zk-type-small);font-weight:var(--zk-fw-bold);color:var(--zk-text-muted)">Calls lock in</span><dc-import name="ZK Countdown" seconds="{{ 4965 }}" variant="pill" size="md" hint-size="100px,26px"></dc-import></div>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;padding:0 var(--zk-space-4)"><span style="font:var(--zk-type-body-strong)">Call the exact score</span><span style="font:var(--zk-type-mono);color:var(--zk-gold)">0.0134 ZEC <span style="font:var(--zk-type-caption);color:var(--zk-text-muted)">~$20</span></span></div>
<div style="background:var(--zk-surface);border-radius:var(--zk-radius-2xl);padding:var(--zk-space-14);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;opacity:{{ pickOp }}">
<div style="display:flex;flex-direction:column;align-items:center;gap:var(--zk-space-8)"><span style="font:var(--zk-type-label);letter-spacing:var(--zk-track-badge);color:var(--zk-text-muted)">BAR</span><div style="display:flex;align-items:center;gap:var(--zk-space-10)"><div role="button" aria-label="BAR minus" onClick="{{ decH }}" style="width:46px;height:46px;border-radius:var(--zk-radius-lg);background:var(--zk-surface-raised);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--zk-bg);cursor:pointer"><dc-import name="ZK Icon" icon="minus" size="{{ 22 }}" stroke="{{ 3 }}" hint-size="22px,22px"></dc-import></div><div style="width:48px;text-align:center;font:var(--zk-type-score)">{{ h }}</div><div role="button" aria-label="BAR plus" onClick="{{ incH }}" style="width:46px;height:46px;border-radius:var(--zk-radius-lg);background:var(--zk-purple);display:flex;align-items:center;justify-content:center;box-shadow:var(--zk-shadow-btn-purple);cursor:pointer"><dc-import name="ZK Icon" icon="plus" size="{{ 22 }}" stroke="{{ 3 }}" hint-size="22px,22px"></dc-import></div></div></div>
<div style="font:var(--zk-type-h2);color:var(--zk-text-muted);padding:var(--zk-space-18) var(--zk-space-4) 0">–</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:var(--zk-space-8)"><span style="font:var(--zk-type-label);letter-spacing:var(--zk-track-badge);color:var(--zk-text-muted)">CHE</span><div style="display:flex;align-items:center;gap:var(--zk-space-10)"><div role="button" aria-label="CHE minus" onClick="{{ decA }}" style="width:46px;height:46px;border-radius:var(--zk-radius-lg);background:var(--zk-surface-raised);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--zk-bg);cursor:pointer"><dc-import name="ZK Icon" icon="minus" size="{{ 22 }}" stroke="{{ 3 }}" hint-size="22px,22px"></dc-import></div><div style="width:48px;text-align:center;font:var(--zk-type-score)">{{ a }}</div><div role="button" aria-label="CHE plus" onClick="{{ incA }}" style="width:46px;height:46px;border-radius:var(--zk-radius-lg);background:var(--zk-purple);display:flex;align-items:center;justify-content:center;box-shadow:var(--zk-shadow-btn-purple);cursor:pointer"><dc-import name="ZK Icon" icon="plus" size="{{ 22 }}" stroke="{{ 3 }}" hint-size="22px,22px"></dc-import></div></div></div>
</div>
<dc-import name="ZK Button" label="{{ lockLabel }}" variant="{{ lockVariant }}" icon-right="lock" size="lg" on-click="{{ toggleLock }}" hint-size="100%,62px"></dc-import>
<div style="display:flex;gap:var(--zk-space-8);flex-wrap:wrap"><dc-import name="ZK Chip" variant="info" icon="medal" label="First correct call wins" hint-size="160px,32px"></dc-import><dc-import name="ZK Chip" variant="info" icon="signal" label="Results from live sports feed" hint-size="200px,32px"></dc-import><dc-import name="ZK Chip" variant="info" icon="target" label="1 call per player" hint-size="120px,32px"></dc-import></div>
<div style="padding:var(--zk-space-14) var(--zk-space-16);border-radius:var(--zk-radius-xl);background:var(--zk-purple-tint);border:1px solid rgb(var(--zk-purple-rgb) / .3);display:flex;align-items:center;gap:var(--zk-space-12)">
<div style="display:flex"><span style="width:28px;height:28px;border-radius:50%;background:var(--zk-pink);border:2px solid var(--zk-surface)"></span><span style="width:28px;height:28px;border-radius:50%;background:var(--zk-sky);border:2px solid var(--zk-surface);margin-left:-10px"></span><span style="width:28px;height:28px;border-radius:50%;background:var(--zk-mint);border:2px solid var(--zk-surface);margin-left:-10px"></span></div>
<div style="font:var(--zk-type-small)"><b>{{ callsN }} calls sealed 🔒.</b> <span style="color:var(--zk-text-muted)">Revealed at kickoff.</span></div>
</div>
</div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { h: 2, a: 1, locked: false };
  renderVals() {
    const s = this.state, set = (k, d) => () => !s.locked && this.setState({ [k]: Math.max(0, Math.min(9, s[k] + d)) });
    return {
      h: s.h, a: s.a, incH: set('h', 1), decH: set('h', -1), incA: set('a', 1), decA: set('a', -1),
      pickOp: s.locked ? '.55' : '1',
      lockLabel: s.locked ? `CALL SEALED ${s.h}–${s.a}` : 'LOCK MY CALL', lockVariant: s.locked ? 'success' : 'primary',
      toggleLock: () => this.setState({ locked: !s.locked }), callsN: s.locked ? 143 : 142
    };
  }
}
</script>
</body>
</html>
