<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
{{ layer }}
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:300},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:70,&quot;min&quot;:10,&quot;max&quot;:150,&quot;tsType&quot;:&quot;number&quot;},&quot;seed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7,&quot;tsType&quot;:&quot;number&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;md&quot;,&quot;sm&quot;],&quot;default&quot;:&quot;md&quot;,&quot;tsType&quot;:&quot;'md'|'sm'&quot;},&quot;run&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;}}">
const COLORS = ['var(--zk-gold)', 'var(--zk-pink)', 'var(--zk-mint)', 'var(--zk-sky)', 'var(--zk-purple)', 'var(--zk-text)'];
class Component extends DCLogic {
  build() {
    const p = this.props, n = p.count ?? 70, small = p.size === 'sm';
    let seed = p.seed ?? 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const kids = Array.from({ length: n }, (_, i) => {
      const w = (small ? 5 : 6) + rnd() * (small ? 6 : 8), h = (small ? 7 : 8) + rnd() * (small ? 7 : 10);
      return React.createElement('span', { key: i, style: { position: 'absolute', left: (rnd() * 100) + '%', top: -20, width: w, height: h, background: COLORS[Math.floor(rnd() * 6)], borderRadius: rnd() > .6 ? '50%' : '2px', animation: `zk-fall ${(2.4 + rnd() * 2.2).toFixed(2)}s linear ${(-rnd() * 4).toFixed(2)}s infinite`, willChange: 'transform' } });
    });
    this.key = `${n}-${p.seed}-${p.run}-${p.size}`;
    this.el = React.createElement('div', { key: 'cf' + (p.run ?? 0), 'aria-hidden': true, style: { position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'hidden', zIndex: 5 } }, kids);
  }
  renderVals() {
    const p = this.props;
    if (!this.el || this.key !== `${p.count ?? 70}-${p.seed}-${p.run}-${p.size}`) this.build();
    return { layer: this.el };
  }
}
</script>
</body>
</html>
