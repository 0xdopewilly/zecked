<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="zk-tokens.css"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Inter:wght@400;500;600;700;800&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet"></helmet>
<section id="11-leaderboard" data-screen-label="11 Leaderboard" style="display:flex;flex-direction:column;gap:var(--zk-space-18);padding:var(--zk-space-14)">
<header style="display:flex;align-items:baseline;gap:var(--zk-space-10);font:var(--zk-type-body-strong);color:var(--zk-text-muted)"><span style="font:var(--zk-type-mono-sm);color:var(--zk-gold)">11</span>Leaderboard<span style="color:var(--zk-text-faint)">· switch tabs</span></header>
<div style="width:var(--zk-phone-w);height:var(--zk-phone-h);border-radius:var(--zk-radius-phone);background:var(--zk-bg-hero-purple);box-shadow:var(--zk-shadow-phone);position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--zk-text);font-family:var(--zk-font-body);flex:none">
<dc-import name="ZK Device Chrome" style="position:absolute;inset:0;z-index:40;pointer-events:none" hint-size="390px,844px"></dc-import>
<div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--zk-space-12);padding:calc(var(--zk-statusbar-h) + var(--zk-space-8)) var(--zk-screen-pad) 0;overflow:hidden">
<h1 style="margin:0;font:var(--zk-fw-black) var(--zk-fs-30)/1 var(--zk-font-display)">Leaderboard</h1>
<div role="tablist" style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--zk-space-4);padding:var(--zk-space-4);border-radius:var(--zk-radius-xl);background:var(--zk-surface)"><sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><div role="tab" aria-selected="{{ t.sel }}" onClick="{{ t.go }}" style="height:40px;border-radius:var(--zk-radius-lg);display:flex;align-items:center;justify-content:center;gap:var(--zk-space-6);font:var(--zk-type-btn-sm);background:{{ t.bg }};color:{{ t.fg }};box-shadow:{{ t.sh }};cursor:pointer"><dc-import name="ZK Icon" icon="{{ t.icon }}" size="{{ 15 }}" stroke="{{ 2.4 }}" hint-size="15px,15px"></dc-import>{{ t.label }}</div></sc-for></div>
<div style="display:flex;gap:var(--zk-space-8)"><sc-for list="{{ periods }}" as="p" hint-placeholder-count="3"><div role="button" aria-pressed="{{ p.sel }}" onClick="{{ p.go }}" style="height:var(--zk-h-chip-sm);padding:0 var(--zk-space-14);border-radius:var(--zk-radius-pill);display:flex;align-items:center;font:var(--zk-type-small);font-weight:var(--zk-fw-bold);background:{{ p.bg }};color:{{ p.fg }};border:1px solid {{ p.bd }};cursor:pointer">{{ p.label }}</div></sc-for></div>
<div style="display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:var(--zk-space-8);margin-top:var(--zk-space-14)">
<div style="display:flex;flex-direction:column;align-items:center">
<div style="width:58px;height:58px;border-radius:50%;background:{{ p2.c }};display:flex;align-items:center;justify-content:center;font:var(--zk-type-h3);font-size:var(--zk-fs-22);color:var(--zk-bg);border:3px solid var(--zk-tier-cracker-mid);box-shadow:var(--zk-shadow-3d-sm)">{{ p2.i }}</div>
<div style="font:var(--zk-type-small);font-weight:var(--zk-fw-bold);margin-top:var(--zk-space-6)">{{ p2.name }}</div><div style="font:var(--zk-type-mono-xs);color:var(--zk-text-muted)">{{ p2.v }}</div>
<div style="width:100%;height:84px;margin-top:var(--zk-space-8);border-radius:var(--zk-radius-lg) var(--zk-radius-lg) var(--zk-radius-sm) var(--zk-radius-sm);background:linear-gradient(180deg,var(--zk-silver-light),var(--zk-tier-cracker-lo));box-shadow:inset 0 3px 0 rgb(var(--zk-white-rgb) / .6),0 5px 0 var(--zk-tier-cracker-edge);display:flex;justify-content:center;padding-top:var(--zk-space-10);box-sizing:border-box;font:var(--zk-fw-black) var(--zk-fs-34)/1 var(--zk-font-display);color:var(--zk-tier-cracker-ink)">2</div>
</div>
<div style="display:flex;flex-direction:column;align-items:center;position:relative">
<div aria-hidden="true" style="position:absolute;top:-30px;color:var(--zk-gold);--zk-tilt:-12deg;animation:zk-bob 2.6s ease-in-out infinite;filter:drop-shadow(0 3px 0 var(--zk-gold-deep))"><dc-import name="ZK Icon" icon="crown" size="{{ 34 }}" filled="{{ true }}" stroke="{{ 1.5 }}" hint-size="34px,34px"></dc-import></div>
<div style="width:74px;height:74px;border-radius:50%;background:{{ p1.c }};display:flex;align-items:center;justify-content:center;font:var(--zk-fw-black) var(--zk-fs-26)/1 var(--zk-font-display);color:var(--zk-bg);border:4px solid var(--zk-gold);box-shadow:0 5px 0 var(--zk-gold-deep),var(--zk-glow-gold)">{{ p1.i }}</div>
<div style="font:var(--zk-type-body-strong);margin-top:var(--zk-space-6)">{{ p1.name }}</div><div style="font:var(--zk-type-mono-xs);color:var(--zk-gold)">{{ p1.v }}</div>
<div style="width:100%;height:120px;margin-top:var(--zk-space-8);border-radius:var(--zk-radius-xl) var(--zk-radius-xl) var(--zk-radius-sm) var(--zk-radius-sm);background:linear-gradient(180deg,var(--zk-gold-bright),var(--zk-gold) 60%,var(--zk-gold-amber));box-shadow:inset 0 3px 0 rgb(var(--zk-white-rgb) / .6),0 5px 0 var(--zk-tier-safecracker-edge);display:flex;justify-content:center;padding-top:var(--zk-space-10);box-sizing:border-box;font:var(--zk-fw-black) var(--zk-fs-40)/1 var(--zk-font-display);color:var(--zk-tier-safecracker-ink)">1</div>
</div>
<div style="display:flex;flex-direction:column;align-items:center">
<div style="width:58px;height:58px;border-radius:50%;background:{{ p3.c }};display:flex;align-items:center;justify-content:center;font:var(--zk-type-h3);font-size:var(--zk-fs-22);color:var(--zk-bg);border:3px solid var(--zk-tier-rookie-mid);box-shadow:var(--zk-shadow-3d-sm)">{{ p3.i }}</div>
<div style="font:var(--zk-type-small);font-weight:var(--zk-fw-bold);margin-top:var(--zk-space-6)">{{ p3.name }}</div><div style="font:var(--zk-type-mono-xs);color:var(--zk-text-muted)">{{ p3.v }}</div>
<div style="width:100%;height:64px;margin-top:var(--zk-space-8);border-radius:var(--zk-radius-lg) var(--zk-radius-lg) var(--zk-radius-sm) var(--zk-radius-sm);background:linear-gradient(180deg,var(--zk-tier-rookie-hi),var(--zk-tier-rookie-mid));box-shadow:inset 0 3px 0 rgb(var(--zk-white-rgb) / .5),0 5px 0 var(--zk-tier-rookie-edge);display:flex;justify-content:center;padding-top:var(--zk-space-8);box-sizing:border-box;font:var(--zk-fw-black) var(--zk-fs-30)/1 var(--zk-font-display);color:var(--zk-tier-rookie-edge)">3</div>
</div>
</div>
<ol style="margin:var(--zk-space-6) 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--zk-space-6)">
<sc-for list="{{ rest }}" as="r" hint-placeholder-count="5"><li style="display:flex;align-items:center;gap:var(--zk-space-12);padding:var(--zk-space-8) var(--zk-space-12);border-radius:var(--zk-radius-lg);background:var(--zk-surface)"><span style="width:24px;font:var(--zk-type-mono-sm);color:var(--zk-text-muted)">{{ r.rank }}</span><span style="width:34px;height:34px;border-radius:50%;background:{{ r.c }};display:flex;align-items:center;justify-content:center;font:var(--zk-type-btn-sm);color:var(--zk-bg)">{{ r.i }}</span><span style="flex:1;font:var(--zk-type-body-strong)">{{ r.name }}</span><dc-import name="ZK Emblem" tier="{{ r.tier }}" size="{{ 22 }}" hint-size="22px,25px"></dc-import><span style="font:var(--zk-type-mono-sm);min-width:64px;text-align:right">{{ r.v }}</span></li></sc-for>
</ol>
</div>
<div style="position:absolute;left:12px;right:12px;bottom:calc(var(--zk-tabbar-h) + var(--zk-space-10));display:flex;align-items:center;gap:var(--zk-space-12);padding:var(--zk-space-10) var(--zk-space-14);border-radius:var(--zk-radius-xl);background:linear-gradient(90deg,var(--zk-purple),var(--zk-purple-mid));box-shadow:0 5px 0 var(--zk-purple-shade),var(--zk-shadow-float);z-index:12">
<span style="font:var(--zk-type-mono-sm)">#47</span><span style="width:34px;height:34px;border-radius:50%;background:var(--zk-text);color:var(--zk-purple-deep);display:flex;align-items:center;justify-content:center;font:var(--zk-type-btn-sm)">N</span><span style="flex:1;font:var(--zk-type-h4)">You · @nightowl</span><span style="display:flex;align-items:center;gap:var(--zk-space-2);font:var(--zk-type-caption);font-weight:var(--zk-fw-bold);color:var(--zk-purple-pale)"><dc-import name="ZK Icon" icon="arrowUp" size="{{ 12 }}" stroke="{{ 3 }}" hint-size="12px,12px"></dc-import>6 this week</span>
</div>
<dc-import name="ZK Tab Bar" active="leaderboard" hint-size="390px,90px"></dc-import>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
const PEOPLE = [
  { name: '@quietfox', i: 'Q', c: 'var(--zk-pink)', tier: 'legend' }, { name: '@riddlr', i: 'R', c: 'var(--zk-sky)', tier: 'oracle' }, { name: '@m0nk', i: 'M', c: 'var(--zk-mint)', tier: 'vault' },
  { name: '@shieldmaiden', i: 'S', c: 'var(--zk-gold)', tier: 'vault' }, { name: '@ghostkey', i: 'G', c: 'var(--zk-purple-light)', tier: 'safecracker' }, { name: '@nullpointer', i: 'N', c: 'var(--zk-tier-rookie-hi)', tier: 'safecracker' },
  { name: '@kaboom', i: 'K', c: 'var(--zk-sky-light)', tier: 'cracker' }, { name: '@zoey.zec', i: 'Z', c: 'var(--zk-mint-light)', tier: 'cracker' }
];
const TABS = {
  Crackers: { order: [0, 1, 2, 3, 4, 5, 6, 7], base: [128, 117, 102, 96, 88, 81, 77, 70], unit: ' cracks', icon: 'unlock' },
  Hiders: { order: [3, 0, 5, 1, 7, 2, 4, 6], base: [42.5, 31.2, 18.9, 12.4, 9.8, 7.1, 5.5, 4.2], unit: ' ZEC', icon: 'vault', dec: true },
  Oracles: { order: [1, 4, 0, 6, 2, 7, 3, 5], base: [31, 27, 22, 19, 17, 14, 12, 11], unit: ' exact', icon: 'orb' }
};
const PER = { Today: 0.08, Week: 0.35, 'All-time': 1 };
class Component extends DCLogic {
  state = { tab: 'Crackers', period: 'Week' };
  renderVals() {
    const s = this.state, T = TABS[s.tab], f = PER[s.period];
    const rows = T.order.map((pi, k) => { const raw = T.base[k] * f; const v = T.dec ? raw.toFixed(raw < 10 ? 2 : 1) : Math.max(1, Math.round(raw)); return { ...PEOPLE[pi], rank: k + 1, v: v + T.unit }; });
    return {
      tabs: Object.keys(TABS).map(k => { const on = s.tab === k; return { label: k, icon: TABS[k].icon, sel: on ? 'true' : 'false', go: () => this.setState({ tab: k }), bg: on ? 'var(--zk-gold)' : 'transparent', fg: on ? 'var(--zk-gold-ink)' : 'var(--zk-text-muted)', sh: on ? 'var(--zk-shadow-chip-active)' : 'none' }; }),
      periods: Object.keys(PER).map(k => { const on = s.period === k; return { label: k, sel: on ? 'true' : 'false', go: () => this.setState({ period: k }), bg: on ? 'var(--zk-text)' : 'transparent', fg: on ? 'var(--zk-bg)' : 'var(--zk-text-muted)', bd: on ? 'var(--zk-text)' : 'var(--zk-border-strong)' }; }),
      p1: rows[0], p2: rows[1], p3: rows[2], rest: rows.slice(3, 8)
    };
  }
}
</script>
</body>
</html>
